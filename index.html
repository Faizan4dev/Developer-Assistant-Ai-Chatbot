<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevAssist</title>
  <!-- <link rel="icon" type="image/png" href="assets/icon.png" sizes="32x32"> -->
   <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
  <link rel="manifest" href="assets/favicon/site.webmanifest">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fanwood+Text:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Rubik+Bubbles&display=swap" rel="stylesheet">
   <!-- Google icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sunny" />
  <!-- axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <!-- markdown -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

</head>

<body>
  <div class="container">
    <div class="smallScreen globalHamburg">
      <i class="fa-solid fa-bars"></i>
    </div>
    <div class="sidebar">
        <!-- <div class="smallScreen">
           <i class="fa-solid fa-bars"></i>
         </div> -->
        <div id="sideHead">
          <img src="assets/icon.png" alt="icon" id="img1">
          <h2 id="sidetitle"> DevAssist</h2>
          <img src="assets/plusIcon-removebg-preview.png" alt="newchat" id="img2">
        </div>
        <div id="sideCenter">
          <p>Recent Chats</p>
          <div id="recentChats">
            <p>no recent chats</p>
          </div>
        </div>
        <div class="foot">
          <p id="toggle"><span class="material-symbols-outlined">sunny</span>Toggle Theme</p>
          <p ><i id="setng" class="fa-solid fa-gear"></i>Settings</p>
        </div>     
    </div> 


    <div class="main">
       <!-- <div class="smallScreen" style="position: absolute; left: 1rem;">
           <i class="fa-solid fa-bars"></i>
        </div> -->
      <div class="chat">
        <div class="smallScreen" style="position: absolute; left: 1rem;">
           <i class="fa-solid fa-bars"></i>
         </div>
        <!-- <p>Hello Gemini!</p>
        <p>Tell about yourself! </p> -->
      </div>
      <div class="mainHead">
         <!-- <div class="smallScreen" style="position: absolute; left: 1rem;">
           <i class="fa-solid fa-bars"></i>
         </div> -->
         <h3>New Chat</h3>
      </div>
      <div class="mainCenter">
         <img src="assets/icon.png" alt="icon">
        <h2>Hye &#x1F44B there Developer!</h2>
        <p>I'm <span style="color: blue;">DevAssist</span>-- your coding companion!</p>
        <p>Ask me to explain code, debug errors or teach you any</p>
        <p>new coding concepts -- simply and clearly!</p>
      </div>
      <div class="mainFooter">
        <div class="outerInput">
          <textarea id="input" placeholder="ask me anything about code..." rows="1"></textarea>
          <select name="mode" id="inputMode" aria-label="select mode">
            <option value="general">General mode</option>
            <option value="explain">💡 Explain Code</option>  <!--used emojis bcoz font icons are not working inside option tag-->
            <option value="debug">🐛 Debug Code</option>
            <option value="teach">🎓 Teach Me</option>
          </select>
          
          <button type="submit" id="submit"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
        <p id="footerText">
          <span style="color: #e24b4a; font-size: 0.85rem;">♥</span>
          Developed by <span style="color: #007bff; font-weight: 600;"><a href="https://www.linkedin.com/in/faizan4dev" target="_blank" rel="noopener noreferrer">Faizan</a></span> &nbsp;·&nbsp; 4 dev
        </p>
      </div>
    </div>

  </div>

  <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script> -->
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
